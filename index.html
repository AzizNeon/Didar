<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    color-scheme: dark;
    --bg: #0d0d0e;
    --ink: #f3eee5;
    --muted: #b4aaa0;
    --accent: #d7b27b;
    --on-accent: #17120b;
    --lyric-size: 2.35rem;
    --lyric-lh: 1.75;
  }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    isolation: isolate;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- background ---------- */
  .glow {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 42%, rgba(156, 112, 57, 0.13) 0%, transparent 52%),
      linear-gradient(180deg, rgba(255,255,255,0.015), transparent 45%);
    opacity: 0.6;
    will-change: opacity, transform;
  }
  canvas#visualizer {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 29vh;
    min-height: 130px;
    max-height: 260px;
    z-index: 0;
    opacity: 0.42;
    pointer-events: none;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.55) 22%, #000 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.55) 22%, #000 100%);
  }

  /* ---------- layout ---------- */
  .container {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 2rem 2rem calc(2rem + 4vh);
    max-width: 900px;
    width: 100%;
  }
  h1 {
    font-weight: 500;
    font-size: 1.65rem;
    margin-bottom: 0.35rem;
    color: var(--accent);
  }
  .artist {
    font-size: 0.95rem;
    color: var(--muted);
    margin-bottom: 2.2rem;
    font-weight: 300;
  }

  /* ---------- lyrics ---------- */
  #lyrics-box {
    min-height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #lyric {
    color: var(--ink);
    font-size: var(--lyric-size);
    font-weight: 500;
    line-height: var(--lyric-lh);
    text-shadow: 0 2px 18px rgba(0,0,0,0.35);
    max-width: 92%;
    text-wrap: balance;
    transition: opacity 0.45s ease, transform 0.45s ease, filter 0.45s ease;
  }
  #lyric.fade-out {
    opacity: 0;
    transform: translateY(8px);
    filter: blur(2px);
  }
  /* بخش بی‌کلام: فقط یک خط آرام که نفس می‌کشد */
  .is-gap #lyric { font-size: 0; min-width: 52px; text-shadow: none; }
  .is-gap #lyric::after {
    content: '';
    display: block;
    width: 42px;
    height: 2px;
    margin: 0 auto;
    border-radius: 4px;
    background: var(--accent);
    opacity: 0.65;
    animation: breathe 2.2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.3; transform: scaleX(0.7); }
    50% { opacity: 0.8; transform: scaleX(1); }
  }

  /* ---------- seek ---------- */
  .seek {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    direction: ltr;
    width: min(560px, 100%);
    margin: 2.2rem auto 0.9rem;
  }
  .time {
    font-size: 0.82rem;
    color: var(--muted);
    min-width: 3.2em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  #cur { text-align: right; }
  #dur { text-align: left; }
  #scrub {
    flex: 1;
    height: 32px;
    display: flex;
    align-items: center;
    cursor: pointer;
    touch-action: none;
    border-radius: 6px;
  }
  #scrub:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .track {
    position: relative;
    width: 100%;
    height: 4px;
    border-radius: 6px;
    background: rgba(255,255,255,0.18);
    transition: height 0.15s ease;
  }
  .buf, .fill {
    position: absolute;
    top: 0; bottom: 0; left: 0;
    width: 0;
    border-radius: inherit;
  }
  .buf { background: rgba(255,255,255,0.16); }
  .fill { background: var(--accent); }
  .fill::after {
    content: '';
    position: absolute;
    right: -6px;
    top: 50%;
    width: 12px;
    height: 12px;
    margin-top: -6px;
    border-radius: 50%;
    background: var(--ink);
    transform: scale(0);
    transition: transform 0.15s ease;
  }
  #scrub:focus-visible .track, #scrub.dragging .track { height: 6px; }
  #scrub:focus-visible .fill::after, #scrub.dragging .fill::after { transform: scale(1); }
  @media (hover: hover) {
    #scrub:hover .track { height: 6px; }
    #scrub:hover .fill::after { transform: scale(1); }
  }
  @media (hover: none) { .fill::after { transform: scale(1); } }

  /* ---------- transport ---------- */
  .transport {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    direction: ltr;
    width: min(560px, 100%);
    margin: 0 auto;
  }
  .transport .l { justify-self: start; }
  .transport .r { justify-self: end; }
  .transport .c { display: flex; align-items: center; gap: 1.1rem; }
  .vol { display: flex; align-items: center; gap: 0.4rem; }
  #vol { width: 88px; accent-color: var(--accent); cursor: pointer; }
  @media (hover: none) { .vol { display: none; } }

  .ctl {
    display: inline-grid;
    place-items: center;
    flex: 0 0 auto;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(215,178,123,0.35);
    color: var(--ink);
    cursor: pointer;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease, color 0.2s ease;
  }
  .ctl svg { width: 22px; height: 22px; display: block; }
  .ctl:active { transform: scale(0.95); }
  .ctl:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  @media (hover: hover) {
    .ctl:hover { background: rgba(215,178,123,0.12); border-color: rgba(215,178,123,0.7); }
  }
  .ctl.small { width: 40px; height: 40px; }
  .ctl.small svg { width: 20px; height: 20px; }
  .ctl[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: rgba(215,178,123,0.12); }

  .ctl.primary {
    width: 66px;
    height: 66px;
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
    position: relative;
  }
  .ctl.primary svg { width: 28px; height: 28px; }
  @media (hover: hover) {
    .ctl.primary:hover { background: #e6c48f; border-color: #e6c48f; }
  }
  .ctl.primary.busy svg { opacity: 0.35; }
  .ctl.primary.busy::after {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #msg {
    min-height: 1.5rem;
    margin-top: 1.1rem;
    font-size: 0.85rem;
    color: var(--accent);
  }

  /* ---------- responsive ---------- */
  @media (max-width: 600px) {
    :root { --lyric-size: 1.65rem; --lyric-lh: 1.9; }
    .container { padding: 1.25rem 1.25rem calc(1.25rem + 3vh); }
    h1 { font-size: 1.45rem; }
    .artist { margin-bottom: 1.6rem; }
    #lyrics-box { min-height: 170px; }
    #lyric { max-width: 96%; }
    #vol { display: none; }
    .seek { margin-top: 1.8rem; gap: 0.6rem; }
    .time { font-size: 0.74rem; min-width: 2.9em; }
    .transport .c { gap: 0.8rem; }
    canvas#visualizer { height: 24vh; min-height: 110px; }
  }
  @media (max-height: 520px) {
    .artist { margin-bottom: 1rem; }
    #lyrics-box { min-height: 7rem; }
    .seek { margin-top: 1rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>

  }

  function seekTo(t) {
    audio.currentTime = clamp(t, 0, dur());
    syncUI();
  }
  function seekBy(d) { seekTo(audio.currentTime + d); }

  /* ---------- نوار پیشرفت ---------- */
  let dragging = false, dragTime = 0, lastShown = '';

  function updateBuffered() {
    const b = audio.buffered, t = audio.currentTime;
    let end = 0;
    for (let i = 0; i < b.length; i++) {
      if (b.start(i) <= t + 0.5 && b.end(i) >= t) { end = b.end(i); break; }
    }
    buf.style.width = (clamp(end / dur(), 0, 1) * 100) + '%';
  }

  function syncUI() {
    const d = dur();
    const tAudio = audio.currentTime;
    const t = dragging ? dragTime : tAudio;

    fill.style.width = (clamp(t / d, 0, 1) * 100) + '%';

    const shown = fmt(t) + '|' + fmt(d, true);
    if (shown !== lastShown) {
      lastShown = shown;
      curEl.textContent = fmt(t);
      durEl.textContent = fmt(d, true);
      scrub.setAttribute('aria-valuemax', Math.floor(d));
      scrub.setAttribute('aria-valuenow', Math.floor(t));
      scrub.setAttribute('aria-valuetext', fmt(t) + ' از ' + fmt(d, true));
    }

    const idx = lyricIndexAt(tAudio);
    if (idx !== curIdx) { showLine(idx); curIdx = idx; }

  }

  const ratioFromEvent = (e) => {
    const r = track.getBoundingClientRect();
    return clamp((e.clientX - r.left) / r.width, 0, 1);
  };
  scrub.addEventListener('pointerdown', (e) => {
    if (e.button > 0) return;
    dragging = true;
    scrub.setPointerCapture(e.pointerId);
    scrub.classList.add('dragging');
    dragTime = ratioFromEvent(e) * dur();
    syncUI();
  });
  scrub.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    dragTime = ratioFromEvent(e) * dur();
    syncUI();
  });
  const endDrag = (e) => {
    if (!dragging) return;
    dragging = false;
    scrub.classList.remove('dragging');
    if (e.type === 'pointerup') audio.currentTime = dragTime;
    syncUI();
    kick();
  };
  scrub.addEventListener('pointerup', endDrag);
  scrub.addEventListener('pointercancel', endDrag);

  scrub.addEventListener('keydown', (e) => {
    const step = { ArrowLeft: -5, ArrowDown: -5, ArrowRight: 5, ArrowUp: 5, PageDown: -15, PageUp: 15 }[e.key];
    if (step !== undefined) seekBy(step);
    else if (e.key === 'Home') seekTo(0);
    else if (e.key === 'End') seekTo(dur());
    else return;
    e.preventDefault();
    e.stopPropagation();
  });

  /* ---------- پخش ---------- */
  function setBusy(b) {
    playBtn.classList.toggle('busy', b);
    playBtn.setAttribute('aria-busy', b ? 'true' : 'false');
  }
  function setPlayUI() {
    const playing = !audio.paused;
    playIcon.firstElementChild.setAttribute('href', playing ? '#i-pause' : '#i-play');
    playBtn.setAttribute('aria-label', playing ? 'توقف' : 'پخش');
    playBtn.title = playing ? 'توقف (Space)' : 'پخش (Space)';
  }

  async function play() {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    if (audio.readyState < 3) setBusy(true);
    clearMsg();
    try {
      await audio.play();
    } catch (err) {
      setBusy(false);
      if (err && err.name === 'AbortError') return;
      if (err && err.name === 'NotAllowedError') showMsg('مرورگر پخش را مسدود کرد. یک بار دیگر روی پخش بزن.');
      else showMsg(mediaErrorText());
    }
  }
  function mediaErrorText() {
    const c = audio.error && audio.error.code;
    if (c === 2) return 'اتصال حین دریافت صدا قطع شد. اینترنت را بررسی کن و دوباره پخش را بزن.';
    if (c === 3) return 'فایل صدا خوانده نشد (خراب یا ناقص است).';
    return 'فایل didar.mp3 بارگذاری نشد. باید کنار index.html روی همان سرور باشد، و سرور باید Range را پشتیبانی کند.';
  }
  const toggle = () => (audio.paused ? play() : audio.pause());

  playBtn.addEventListener('click', toggle);
  backBtn.addEventListener('click', () => seekBy(-10));
  fwdBtn.addEventListener('click', () => seekBy(10));
  loopBtn.addEventListener('click', () => {
    audio.loop = !audio.loop;
    loopBtn.setAttribute('aria-pressed', audio.loop ? 'true' : 'false');
  });

  /* ---------- صدا ---------- */
  function syncVolumeUI() {
    const silent = audio.muted || audio.volume === 0;
    muteIcon.firstElementChild.setAttribute('href', silent ? '#i-mute' : '#i-vol');
    muteBtn.setAttribute('aria-label', silent ? 'وصل صدا' : 'قطع صدا');
    volEl.value = audio.muted ? 0 : audio.volume;
  }
  muteBtn.addEventListener('click', () => {
    if (audio.muted || audio.volume === 0) { audio.muted = false; if (audio.volume === 0) audio.volume = 0.6; }
    else audio.muted = true;
  });
  volEl.addEventListener('input', () => { audio.muted = false; audio.volume = +volEl.value; });
  audio.addEventListener('volumechange', syncVolumeUI);

  /* ---------- رویدادهای audio ---------- */
  audio.addEventListener('play', () => { setPlayUI(); kick(); updatePosition(); });
  audio.addEventListener('playing', () => { setBusy(false); setPlayUI(); kick(); });
  audio.addEventListener('pause', () => { setBusy(false); setPlayUI(); updatePosition(); kick(); });
  audio.addEventListener('ended', () => { setBusy(false); setPlayUI(); syncUI(); });
  audio.addEventListener('waiting', () => { if (!audio.paused) setBusy(true); });
  audio.addEventListener('canplay', () => setBusy(false));
  audio.addEventListener('seeked', () => { syncUI(); updatePosition(); });
  audio.addEventListener('timeupdate', () => { if (audio.paused) syncUI(); });
  audio.addEventListener('loadedmetadata', () => { syncUI(); updateBuffered(); updatePosition(); });
  audio.addEventListener('durationchange', syncUI);
  audio.addEventListener('progress', updateBuffered);
  audio.addEventListener('error', () => { setBusy(false); showMsg(mediaErrorText()); });

  /* ---------- کلیدهای میان‌بر ---------- */
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target;
    if (t.tagName === 'INPUT') return;
    if (t.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
    switch (e.key) {
      case ' ': case 'k': case 'K': toggle(); break;
      case 'ArrowRight': seekBy(5); break;
      case 'ArrowLeft': seekBy(-5); break;
      case 'l': case 'L': seekBy(10); break;
      case 'j': case 'J': seekBy(-10); break;
      case 'Home': seekTo(0); break;
      case 'm': case 'M': muteBtn.click(); break;
      case 'ArrowUp': audio.muted = false; audio.volume = clamp(audio.volume + 0.05, 0, 1); break;
      case 'ArrowDown': audio.volume = clamp(audio.volume - 0.05, 0, 1); break;
      default: return;
    }
    e.preventDefault();
  });

  /* ---------- Media Session (قفل صفحه و کلیدهای مدیا) ---------- */
  function updatePosition() {
    if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
    try {
      navigator.mediaSession.setPositionState({
        duration: dur(),
        position: clamp(audio.currentTime, 0, dur()),
        playbackRate: audio.playbackRate || 1
      });
    } catch (_) {}
  }
  if ('mediaSession' in navigator) {
    try { navigator.mediaSession.metadata = new MediaMetadata({ title: 'دیدار', artist: 'شهرام شب‌پره' }); } catch (_) {}
    const on = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (_) {} };
    on('play', play);
    on('pause', () => audio.pause());
    on('seekbackward', (d) => seekBy(-(d.seekOffset || 10)));
    on('seekforward', (d) => seekBy(d.seekOffset || 10));
    on('seekto', (d) => seekTo(d.seekTime));
  }

  /* ---------- طیف صدا ---------- */
  // iOS صدای مسیرداده‌شده از Web Audio را در پس‌زمینه قطع می‌کند؛ آنجا طیف را نرم و ساختگی می‌کشیم.
  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let audioCtx = null, analyser = null, freq = null, graphFailed = false;
  const levels = new Float32Array(N_HALF);
  let usable = 0, synthLevel = 0, energy = 0;

  function canUseWebAudio() {
    try {
      const u = new URL(audio.currentSrc || audio.src, location.href);
      return /^https?:$/.test(location.protocol) && u.origin === location.origin;
    } catch (_) { return false; }
  }
  function initAudio() {
    if (audioCtx || isIOS || graphFailed) return;
    if (!canUseWebAudio()) { graphFailed = true; return; }
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      analyser.smoothingTimeConstant = 0.8;
      const source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      freq = new Uint8Array(analyser.frequencyBinCount);
      usable = Math.floor(freq.length * 0.6);
    } catch (err) {
      console.warn('Web Audio unavailable, using ambient visualizer', err);
      graphFailed = true; audioCtx = null; analyser = null;
    }
  }

  
  let cw = 0, ch = 0, cY = 0, maxH = 0, barGrad = null;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cw = canvas.clientWidth; ch = canvas.clientHeight;
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cY = ch * 0.66;
    maxH = ch * 0.34;
    barGrad = ctx.createLinearGradient(0, cY - maxH, 0, cY + maxH * 0.6);
    barGrad.addColorStop(0, 'rgba(215,178,123,0.5)');
    barGrad.addColorStop(0.625, 'rgba(181,137,82,0.26)');
    barGrad.addColorStop(1, 'rgba(215,178,123,0.05)');
    kick();
  }
  new ResizeObserver(resize).observe(canvas);

  const smooth = new Float32Array(N_HALF);
  const tmp = new Float32Array(N_HALF);
  let lastNow = 0;

  function readLevels(now, dt) {
    const raw = levels;
    if (analyser) {
      analyser.getByteFrequencyData(freq);
      let a = 0;
      for (let k = 0; k < N_HALF; k++) {
        const b = Math.max(a + 1, Math.floor(Math.pow((k + 1) / N_HALF, 1.5) * usable));
        let sum = 0;
        for (let i = a; i < b; i++) sum += freq[i];
        raw[k] = sum / (b - a) / 255;
        a = b;
      }
    } else {
      synthLevel += ((audio.paused ? 0 : 1) - synthLevel) * Math.min(1, dt / 250);
      for (let k = 0; k < N_HALF; k++) {
        const x = 0.5 + 0.5 * Math.sin(now / 900 + k * 0.38);
        const y = 0.5 + 0.5 * Math.sin(now / 1700 + k * 0.17);
        raw[k] = synthLevel * x * y * (0.62 - (k / N_HALF) * 0.38);
      }
    }
    // هم‌سایه‌ها را کمی با هم میانگین می‌گیریم تا قله‌های تیز نرم شوند
    for (let k = 0; k < N_HALF; k++) {
      const l = raw[Math.max(0, k - 1)], r = raw[Math.min(N_HALF - 1, k + 1)];
      tmp[k] = l * 0.25 + raw[k] * 0.5 + r * 0.25;
    }
    // بالا رفتن نسبتاً تند، پایین آمدن آرام: موج نمی‌پرد، شناور می‌شود
    const up = 1 - Math.exp(-dt / 90), down = 1 - Math.exp(-dt / 380);
    let max = 0;
    for (let k = 0; k < N_HALF; k++) {
      smooth[k] += (tmp[k] - smooth[k]) * (tmp[k] > smooth[k] ? up : down);
      if (smooth[k] > max) max = smooth[k];
    }
    energy = max;
  }

  const px = new Float32Array(N_HALF * 2), py = new Float32Array(N_HALF * 2);
  function drawViz(now, dt) {
    readLevels(now, dt);
    ctx.clearRect(0, 0, cw, ch);

    const n = N_HALF * 2, step = cw / (n - 1);
    for (let j = 0; j < n; j++) {          // از چپ به راست؛ بم‌ها وسط، زیرها دو طرف
      const k = j < N_HALF ? N_HALF - 1 - j : j - N_HALF;
      px[j] = j * step;
      py[j] = smooth[k] * maxH + 1.5;
    }

    ctx.beginPath();
    ctx.moveTo(px[0], cY - py[0]);
    for (let j = 1; j < n; j++) {
      const mx = (px[j - 1] + px[j]) / 2, my = cY - (py[j - 1] + py[j]) / 2;
      ctx.quadraticCurveTo(px[j - 1], cY - py[j - 1], mx, my);
    }
    ctx.lineTo(px[n - 1], cY - py[n - 1]);
    ctx.strokeStyle = 'rgba(215,178,123,0.55)';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.lineTo(px[n - 1], cY + py[n - 1] * 0.6);
    for (let j = n - 2; j >= 0; j--) {
      const mx = (px[j + 1] + px[j]) / 2, my = cY + (py[j + 1] + py[j]) * 0.3;
      ctx.quadraticCurveTo(px[j + 1], cY + py[j + 1] * 0.6, mx, my);
    }
    ctx.closePath();
    ctx.fillStyle = barGrad;
    ctx.fill();

    let bass = 0;
    for (let k = 0; k < 4; k++) bass += smooth[k];
    bass /= 4;
    glow.style.opacity = (0.6 + 0.3 * Math.min(1, bass * 1.4)).toFixed(3);
    glow.style.transform = 'scale(' + (1 + bass * 0.03).toFixed(4) + ')';
  }

  // یک حلقه‌ی واحد: فقط وقتی پخش است (یا موج در حال فروکش‌کردن است) اجرا می‌شود
  let raf = 0;
  function frame(now) {
    raf = 0;
    const dt = lastNow ? Math.min(now - lastNow, 64) : 16;
    lastNow = now;
    syncUI();
    drawViz(now, dt);
    if (!audio.paused || energy > 0.004) raf = requestAnimationFrame(frame);
    else lastNow = 0;
  }
  function kick() { if (!raf) raf = requestAnimationFrame(frame); }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) kick(); });

  /* ---------- شروع ---------- */
  syncVolumeUI();
  setPlayUI();
  syncUI();
  kick();
})();
</script>
</body>
</html>
